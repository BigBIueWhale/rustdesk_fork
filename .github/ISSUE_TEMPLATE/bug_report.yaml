name: 🐞 Bug report
description: Report a problem with the hardened direct-IP fork. Please write in English.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report bugs in this fork here. For questions or feature requests, choose a blank issue in this repository.
  - type: textarea
    id: desc
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is (if it's a keyboard issue, provide the keyboard mode you're using. e.g. legacy, map, translate)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to Reproduce
      description: What steps can we take to reproduce this behavior?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system(s) on local (controlling) side and remote (controlled) side
      description: What operating system(s) do you see this bug on? local (controlling) side -> remote (controlled) side.
      placeholder: |
        Windows 10 -> osx
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Fork build on each side
      description: |
        For each side, give the fork version and full source commit from the verified release's SHA256SUMS header, plus the package filename and whether it is installed or portable. For a source build, give the full build commit and describe local changes. The shared app version alone does not identify a fork build. If an identity is unavailable, say so and describe where you obtained that build.
      placeholder: |
        Controlling side: fork version, full commit, package/source, installed or portable
        Controlled side: fork version, full commit, package/source, installed or portable
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please add screenshots to help explain your problem, if applicable, please upload video.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any additonal context about the problem here
