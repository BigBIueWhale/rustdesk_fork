name: texture_rgba_renderer
description: RustDesk-owned BGRA desktop texture renderer.
version: 0.0.16+rustdesk.1
publish_to: none
homepage: https://github.com/rustdesk-org/flutter_texture_rgba_renderer

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: TextureRgbaRendererPlugin
      macos:
        pluginClass: TextureRgbaRendererPlugin
      windows:
        pluginClass: TextureRgbaRendererPluginCApi
