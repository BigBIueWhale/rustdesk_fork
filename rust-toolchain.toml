# Product toolchain default (R-R1, R-B5a, requirements.html §3.2).
# Keep this channel consistent with the release manifest in scripts/pins.env.
# A toolchain update requires reviewed matching pins, locked target builds and
# the R-R3 dependency-advisory gate.

[toolchain]
channel = "1.75"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
    # The three shipped build targets (R-R2). Apple check-only triples
    # (x86_64/aarch64-apple-darwin, aarch64-apple-ios) are supplied only to the
    # dedicated source-conformance checker, not installed on every build host.
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
]
