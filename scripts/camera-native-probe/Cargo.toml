[package]
name = "rustdesk-camera-native-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.103"
cfg-if = "=1.0.0"
lazy_static = "=1.5.0"
libc = "=0.2.171"
nokhwa = { git = "https://github.com/rustdesk-org/nokhwa.git", branch = "fix_from_raw_parts", features = ["input-native"] }
protobuf_it = { path = "../../libs/protobuf_it" }
serde_json = "=1.0.118"
sha2 = "=0.10.8"
v4l = { version = "=0.14.0", features = ["v4l2-sys"] }

[profile.release]
panic = "abort"

[patch."https://github.com/rustdesk-org/nokhwa.git"]
nokhwa-bindings-linux = { path = "../../libs/nokhwa-bindings-linux" }
